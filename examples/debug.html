<!doctype html>
<html>
  <head>
    <title>Gist Demo — Debug Console</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta charset="utf-8" />
    <link href="styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="inbox-header">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <div class="inbox-icon-container toggle-inbox">
        <svg class="inbox-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
          <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
        </svg>
        <span class="inbox-badge" id="inboxBadge" style="display: none;">0</span>
      </div>
    </div>
    <div class="inbox-panel" id="inboxPanel" style="display: none;">
      <div class="inbox-panel-header">
        <h3>Inbox Messages</h3>
        <button class="close-btn toggle-inbox">×</button>
      </div>
      <div class="inbox-panel-content" id="inboxPanelContent">
        <p class="no-messages">No messages</p>
      </div>
    </div>
    <nav class="page-nav" aria-label="Demo pages">
      <span class="page-nav-label">Pages</span>
      <a id="nav-messages" href="index.html">Messages</a>
      <a id="nav-tooltips" href="tooltips.html">Tooltips</a>
      <a id="nav-debug" href="debug.html" aria-current="page">Debug Console</a>
    </nav>
    <main class="demo-page">
      <p class="page-meta">Path <code>/examples/debug.html</code> · Route <code>debug</code> · Override config, edit active message display settings, and watch the live Gist event log.</p>
      <div id="debugConsoleHost"></div>
    </main>

    <script src="settings.js"></script>
    <script src="demo-page.js"></script>
    <script src="../dist/gist.js"></script>
    <script type="text/javascript">
      initDemoPage('debug');
    </script>
    <script src="debug-console.js"></script>
    <script src="inbox.js"></script>
  </body>
</html>
